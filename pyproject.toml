[project]
name = "cl-reasoning"
version = "0.1.0"
description = ""
authors = [
    {name = "mjlee",email = "yenchieh0826@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14.1"
dependencies = [
    "tqdm (>=4.70.0,<5.0.0)",
    "transformers (>=5.16.1,<6.0.0)",
    "torch (>=2.14.0,<3.0.0)",
    "torchvision (>=0.29.0,<0.30.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "tabulate (>=0.10.0,<0.11.0)",
    "statsmodels (>=0.15.0,<0.16.0)",
    "openai (>=3.8.0,<4.0.0)",
    "tiktoken (>=0.14.0,<0.15.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "datasets (>=5.0.1,<6.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cu126"}
torchvision = {source = "pytorch-cu126"}
